name: Merge EPG

on:
  # 定时全自动运行（GitHub 使用 UTC 时间）
  schedule:
    # 分钟数错开整点：GitHub 在整点高峰会延迟甚至丢弃定时任务
    - cron: "17 */4 * * *"

  # 保留手动触发按钮（随时想更新可以在网页上点 Run workflow）
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "M3U URL (leave blank to use the M3U_URL secret)"
        required: false
        default: ""
      impersonate:
        description: "Browser fingerprint (chrome / safari / safari_ios / chrome136 …)"
        required: false
        default: "chrome"

  # 当 main 分支上的脚本或工作流文件更新时自动触发一次
  # （限定 main：其他分支的推送不会触发运行，也就不会覆盖正式发布的 Release）
  push:
    branches:
      - main
    paths:
      - "scripts/epg.py"
      - "scripts/publish_release.sh"
      - ".github/workflows/epg.yml"

jobs:
  merge-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: merge-epg
      cancel-in-progress: false
    permissions:
      contents: write # 赋予 Release 发布写入权限

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -B -m unittest discover -s tests

      # ── 4. Run the merger ─────────────────────────────────────────────────
      - name: Run EPG merger
        env:
          M3U_URL: ${{ inputs.m3u_url || secrets.M3U_URL }}
          OUTPUT_PATH: output/merged_epg.xml.gz
          MAX_WORKERS: "6"
          REQUEST_TIMEOUT: "60"
          LOGO_CHECK_TIMEOUT: "30"
          LOGO_REQUEST_TIMEOUT: "5"
          IMPERSONATE: ${{ inputs.impersonate || 'chrome' }}
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}

        run: |
          echo "MERGE_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_ENV
          python scripts/epg.py

      # 失败时也把 release notes 写进运行摘要，方便排查哪个源出了问题
      - name: Job summary
        if: always()
        run: |
          [ -f output/release_notes.md ] && cat output/release_notes.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh
