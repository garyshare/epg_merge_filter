name: Merge EPG

on:
  # 定时全自动运行（GitHub 使用 UTC 时间）
  # 每天北京时间 04:00 和 16:00 各自动抓取更新一次（UTC 20:00 和 08:00）
  schedule:
    - cron: "0 8,20 * * *"

  # 保留手动触发按钮（随时想更新可以在网页上点 Run workflow）
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "M3U URL (leave blank to use the M3U_URL secret)"
        required: false
        default: ""
      impersonate:
        description: "Browser fingerprint (chrome / safari / safari_ios / chrome136 …)"
        required: false
        default: "chrome"

  # 当更新脚本或工作流文件时自动触发一次
  push:
    paths:
      - "scripts/epg.py"
      - ".github/workflows/epg.yml"

jobs:
  merge-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 Release 发布写入权限

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the merger ─────────────────────────────────────────────────
      - name: Run EPG merger
        env:
          M3U_URL: ${{ inputs.m3u_url || secrets.M3U_URL }}
          OUTPUT_PATH: output/merged_epg.xml.gz
          MAX_WORKERS: "6"
          REQUEST_TIMEOUT: "60"
          IMPERSONATE: ${{ inputs.impersonate || 'chrome' }}
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}

        run: |
          echo "MERGE_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_ENV
          python scripts/epg.py

      # ── 5. Update latest tag ──────────────────────────────────────────────
      - name: Update latest tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m latest
          git push origin latest --force

      # ── 6. Publish as a Release asset ─────────────────────────────────────
      # 发布到永久下载地址:
      #   https://github.com/garyshare/epg_merge_filter/releases/latest/download/merged_epg.xml.gz
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          make_latest: true
          name: Merged EPG @ ${{ env.MERGE_TIME }}
          body_path: output/release_notes.md
          files: output/merged_epg.xml.gz
